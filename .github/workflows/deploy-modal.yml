name: Deploy otak ke Modal
# Salin rahsia dari GitHub Secrets ke Modal Secret "jombaca", kemudian deploy cron setiap jam.
on:
  push:
    branches: [main]
    paths: ["brain/**", ".github/workflows/deploy-modal.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HQ_URL: ${{ secrets.HQ_URL }}
          BRAIN_KEY: ${{ secrets.BRAIN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_COMPAT_BASE: ${{ secrets.OPENAI_COMPAT_BASE }}
          OPENAI_COMPAT_KEY: ${{ secrets.OPENAI_COMPAT_KEY }}
          OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then echo "MODAL_TOKEN_ID belum ditetapkan. Langkau."; exit 0; fi
          pip install -q "modal>=1.0"
          args=()
          for k in HQ_URL BRAIN_KEY GEMINI_API_KEY ANTHROPIC_API_KEY OPENAI_COMPAT_BASE OPENAI_COMPAT_KEY OPENAI_COMPAT_MODEL; do
            v="${!k}"; if [ -n "$v" ]; then args+=("$k=$v"); fi
          done
          if [ -n "$GH_ISSUES_TOKEN" ]; then args+=("GITHUB_TOKEN=$GH_ISSUES_TOKEN" "GITHUB_REPO=$REPO"); fi
          modal secret create jombaca "${args[@]}" --force
          modal deploy brain/modal_app.py
