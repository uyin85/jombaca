name: Otak Jom Baca (GitHub Actions)
# Jalan setiap jam sebagai sandaran kepada Modal. Selamat dijalankan serentak:
# HQ guna "claim" supaya setiap agen hanya jalan sekali bagi setiap slot.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Nama agen untuk dijalankan sekarang (ceo, social, creative, marketing, leads, affiliate, product, reflect, atau media-test). Kosong = ikut jadual."
        required: false
        default: ""
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang Chromium & suara (hanya bila agen Sosial mungkin berjalan)
        env:
          INPUT_AGENT: ${{ inputs.agent }}
        run: |
          H=$(( ( $(date -u +%-H) + 8 ) % 24 ))
          if [ "$INPUT_AGENT" = "social" ] || [ "$INPUT_AGENT" = "media-test" ] || { [ $H -ge 7 ] && [ $H -le 9 ]; }; then
            (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)) && pip install -q playwright==1.47.0 edge-tts==7.2.0 gTTS==2.5.4 && python -m playwright install --with-deps chromium
          else
            echo "Bukan waktu agen Sosial ($H:00 MYT). Langkau."
          fi
      - name: Jalankan agen
        env:
          HQ_URL: ${{ secrets.HQ_URL }}
          BRAIN_KEY: ${{ secrets.BRAIN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_COMPAT_BASE: ${{ secrets.OPENAI_COMPAT_BASE }}
          OPENAI_COMPAT_KEY: ${{ secrets.OPENAI_COMPAT_KEY }}
          OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          JB_FONTS: ${{ github.workspace }}/brain/fonts
          INPUT_AGENT: ${{ inputs.agent }}
        run: |
          if [ -z "$HQ_URL" ] || [ -z "$BRAIN_KEY" ]; then echo "HQ_URL / BRAIN_KEY belum ditetapkan dalam GitHub Secrets. Langkau."; exit 0; fi
          if [ -n "$INPUT_AGENT" ]; then python -m brain.run agent "$INPUT_AGENT"; else python -m brain.run tick; fi
